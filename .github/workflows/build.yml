# Build: every push to main and every pull request builds the three projects with warnings as errors and runs the offline
# tests (a fake Mod Organizer folder - no MO2, no game). Docs-only changes skip it.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build "src/MO2 Tool Runner.slnx" -c Release -nologo
      - name: Offline tests
        run: dotnet run --project src/Runner.Tests -c Release --no-build
      - name: Single-file exe
        shell: pwsh
        run: |
          dotnet publish src/Runner.App -c Release -nologo -o publish
          $exe = Get-Item "publish/MO2 Tool Runner.exe"
          "### MO2 Tool Runner.exe: $([math]::Round($exe.Length / 1KB)) KB" >> $env:GITHUB_STEP_SUMMARY
